[package]
name = "harpy-launcher"
version = "0.1.1"
description = "Launcher Harpy Express"
authors = ["Sachayelo"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "harpy_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.6", features = [] }
tauri-plugin-log = "2"
reqwest = "0.12"
sha2 = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
sysinfo = "0.33"
open = "5"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
minisign-verify = "0.2"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

# Hashing 80 MB of jars is noticeably slow without optimisations, even in dev.
[profile.dev.package.sha2]
opt-level = 3
